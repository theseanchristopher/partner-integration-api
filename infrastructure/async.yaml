AWSTemplateFormatVersion: '2010-09-09'
Description: Asynchronous partner eligibility processing

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket containing the Lambda deployment package
  CodeKey:
    Type: String
    Description: S3 object key for the Lambda deployment package
  ApiId:
    Type: String
    Description: Existing HTTP API ID from the service stack
  JwtAuthorizerId:
    Type: String
    Description: Existing JWT authorizer ID from the service stack
  PartnerClientId:
    Type: String
    Description: Cognito client ID for merchant access configuration
  EnableFailureTests:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable simulated failures for operator-created test records
  ComponentAUrl:
    Type: String
    Description: Component A HTTP endpoint URL
  ComponentAInvokeArn:
    Type: String
    Description: Exact API route ARN the worker may invoke

Resources:
  RequestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  ProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessingDLQ.Arn
        maxReceiveCount: 5

  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-dispatcher'
      RetentionInDays: 7

  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DispatchRequests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt RequestTable.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: '*'
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt RequestTable.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt ProcessingQueue.Arn
                  - !GetAtt DispatchFailureQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DispatcherLogGroup.Arn

  DispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dispatcher'
      Runtime: python3.12
      Handler: dispatcher.lambda_handler
      Role: !GetAtt DispatcherRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          REQUEST_TABLE_NAME: !Ref RequestTable
          PROCESSING_QUEUE_URL: !Ref ProcessingQueue

  DispatchFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DispatcherStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RequestTable.StreamArn
      FunctionName: !Ref DispatcherFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      MaximumRetryAttempts: 5
      MaximumRecordAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt DispatchFailureQueue.Arn

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-worker'
      RetentionInDays: 7

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessRequests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ProcessingQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RequestTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WorkerLogGroup.Arn
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource: !Ref ComponentAInvokeArn

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-worker'
      Runtime: python3.12
      Handler: worker.lambda_handler
      Role: !GetAtt WorkerRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          REQUEST_TABLE_NAME: !Ref RequestTable
          ENABLE_FAILURE_TESTS: !Ref EnableFailureTests
          COMPONENT_A_URL: !Ref ComponentAUrl

  WorkerQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ProcessingQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

  AsyncApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7

  AsyncApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageEligibilityRequests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt RequestTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AsyncApiLogGroup.Arn

  AsyncApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.12
      Handler: async_handler.lambda_handler
      Role: !GetAtt AsyncApiRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          REQUEST_TABLE_NAME: !Ref RequestTable
          PARTNER_ACCESS_MAP: !Sub |
            {
              "${PartnerClientId}": {
                "merchant-1001": ["COMPONENT_A", "COMPONENT_B"]
              }
            }

  AsyncApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AsyncApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 12000

  SubmitRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: 'POST /eligibility-requests'
      Target: !Sub 'integrations/${AsyncApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizerId
      AuthorizationScopes:
        - partner-api/eligibility.submit

  GetRequestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: 'GET /eligibility-requests/{requestId}'
      Target: !Sub 'integrations/${AsyncApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizerId
      AuthorizationScopes:
        - partner-api/eligibility.read

  SubmitInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AsyncApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/POST/eligibility-requests'

  GetInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AsyncApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/GET/eligibility-requests/*'

  DlqHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-dlq-handler'
      RetentionInDays: 7

  DlqHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ArchiveProcessingFailures
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ProcessingDLQ.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RequestTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DlqHandlerLogGroup.Arn

  DlqHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dlq-handler'
      Runtime: python3.12
      Handler: dlq_handler.lambda_handler
      Role: !GetAtt DlqHandlerRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          REQUEST_TABLE_NAME: !Ref RequestTable

  DlqHandlerQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ProcessingDLQ.Arn
      FunctionName: !Ref DlqHandlerFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  RequestTableName:
    Description: Table containing request and idempotency records
    Value: !Ref RequestTable
  RequestTableStreamArn:
    Description: Stream used to forward new requests to SQS
    Value: !GetAtt RequestTable.StreamArn
  ProcessingQueueUrl:
    Value: !Ref ProcessingQueue
  ProcessingQueueArn:
    Value: !GetAtt ProcessingQueue.Arn
  ProcessingDLQUrl:
    Value: !Ref ProcessingDLQ
  SubmissionUrl:
    Value: !Sub 'https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/eligibility-requests'
