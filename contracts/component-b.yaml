openapi: 3.1.0

info:
  title: Simulated Component B API
  version: 0.3.0
  description: >
    Client certificate authentication is enforced at the custom domain.
    Clients must present a certificate signed by a CA in the truststore.
    Missing or untrusted certificates can cause connection rejection
    before an HTTP response is returned.

servers:
  - url: https://component-b.seanxtopher.net

security:
  - clientCertificate: []

paths:
  /account-status:
    post:
      summary: Look up merchant account status
      operationId: getAccountStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - accountReference
              properties:
                accountReference:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Account found; enabled means active and eligible
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountReference
                  - enabled
                  - profile
                  - capabilities
                  - onboarding
                properties:
                  accountReference:
                    type: string
                  enabled:
                    type: boolean
                  profile:
                    type: object
                    required: [country]
                    properties:
                      country:
                        type: string
                        pattern: '^[A-Z]{2}$'
                  capabilities:
                    type: object
                    required: [cardAcceptance]
                    properties:
                      cardAcceptance:
                        type: boolean
                  onboarding:
                    type: object
                    required: [complete, requirements]
                    properties:
                      complete:
                        type: boolean
                      requirements:
                        type: array
                        description: Outstanding requirements; empty when complete
                        items:
                          type: string
                          minLength: 1
        '400':
          description: Invalid JSON, missing fields, or invalid accountReference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure

components:
  securitySchemes:
    clientCertificate:
      type: mutualTLS
      description: >
        Present the client certificate and prove possession of its
        private key during the TLS handshake.
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
