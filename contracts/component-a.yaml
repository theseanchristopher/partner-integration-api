openapi: 3.0.3

info:
  title: Simulated Component A API
  version: 0.2.0
  description: >
    IAM-authenticated component API. Requests require AWS Signature
    Version 4 signing and execute-api:Invoke permission for this route.
    The Authorization header contains a signature, not a bearer token.

security:
  - awsSigV4: []

paths:
  /merchant-status:
    post:
      summary: Look up merchant status
      operationId: getMerchantStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - merchant_id
              properties:
                merchant_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Merchant found; A means active, I means inactive
          content:
            application/json:
              schema:
                type: object
                required:
                  - merchant_id
                  - status
                properties:
                  merchant_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - A
                      - I
        '400':
          description: Invalid JSON, missing fields, or invalid merchant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid AWS signature, or insufficient IAM permission
        '404':
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure


components:
  securitySchemes:
    awsSigV4:
      type: apiKey
      in: header
      name: Authorization
      x-amazon-apigateway-authtype: awsSigv4
      description: >
        SigV4 signature generated using AWS credentials.
        This OpenAPI representation does not mean an API key is used.
        Signing also supplies X-Amz-Date and, for temporary credentials,
        X-Amz-Security-Token.
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
