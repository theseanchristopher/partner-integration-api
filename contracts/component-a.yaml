openapi: 3.0.3

info:
  title: Simulated Component A API
  version: 0.1.0

paths:
  /merchant-status:
    post:
      summary: Look up merchant status
      operationId: getMerchantStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - merchant_id
              properties:
                merchant_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Merchant found; A means active, I means inactive
          content:
            application/json:
              schema:
                type: object
                required:
                  - merchant_id
                  - status
                properties:
                  merchant_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - A
                      - I
        '404':
          description: Merchant not found
        '500':
          description: Unexpected internal failure
